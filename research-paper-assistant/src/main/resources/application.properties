spring.application.name=research-paper-assistant

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/researchdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=false

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Server
server.port=8081

# JWT (set JWT_SECRET to a value of at least 32 bytes; if blank,
# a random key is generated at startup and tokens do not survive restarts)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

# Python AI service
app.ai.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai.timeout-seconds=180
# Sent as X-Internal-Token header when non-blank
app.ai.token=${AI_SERVICE_TOKEN:}

# Uploaded PDF storage
app.upload-dir=uploads/papers

# CORS (comma separated)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
